name: deploy-frontend

on:
  push:
    branches:
      - iac
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  FRONTEND_APP_NAME: ${{ vars.RESOURCE_NAME_PREFIX }}-frontend

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing frontend dependencies..."
          pnpm install --frozen-lockfile

      - name: Build application
        working-directory: frontend
        run: |
          echo "🔨 Building frontend application..."
          # React Router v7 requires `react-router build` to generate a deployable SPA (build/client/index.html).
          pnpm exec react-router build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Prepare deployment package
        working-directory: frontend
        run: |
          echo "📦 Preparing deployment package..."

          # Create deployment directory
          mkdir -p ../deploy-package

          # Copy build output
          # React Router (and some Vite configs) emit a nested client build (e.g. build/client).
          # App Service expects the site root (wwwroot) to contain index.html.
          if [ -d "build/client" ]; then
            echo "Detected build/client output; flattening to deployment root"
            cp -r build/client/* ../deploy-package/
          elif [ -d "dist/client" ]; then
            echo "Detected dist/client output; flattening to deployment root"
            cp -r dist/client/* ../deploy-package/
          elif [ -d "build" ]; then
            cp -r build/* ../deploy-package/
          elif [ -d "dist" ]; then
            cp -r dist/* ../deploy-package/
          else
            echo "❌ Build output directory not found!"
            exit 1
          fi

          # Create package.json for runtime dependencies
          cat > ../deploy-package/package.json << 'PACKAGEEOF'
          {
            "name": "ground-truth-frontend",
            "version": "1.0.0",
            "scripts": {
              "start": "serve -s . -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.0"
            }
          }
          PACKAGEEOF

          # Install dependencies for deployment
          echo "📥 Installing runtime dependencies..."
          cd ../deploy-package
          npm install --production --no-optional
          cd ../frontend

          echo "✅ Deployment package prepared"
          ls -la ../deploy-package/

      - name: Create deployment zip
        run: |
          echo "📦 Creating zip deployment package..."
          cd deploy-package
          zip -r ../frontend-app.zip .
          cd ..
          ls -lh frontend-app.zip

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app-${{ github.sha }}
          path: frontend-app.zip
          retention-days: 7

  deploy:
    name: Deploy Frontend to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app-${{ github.sha }}
          path: ./deploy

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service startup
        run: |
          echo "⚙️ Configuring App Service startup command..."
          # Linux App Service (Node) sometimes falls back to serving wwwroot if no startup is set.
          # Explicitly run our package.json start script.
          az webapp config set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --startup-file "npm start"

      - name: Configure App Service deployment settings
        run: |
          echo "⚙️ Configuring App Service deployment settings..."
          # Reduce Kudu work during ZIP deployment and improve reliability.
          az webapp config appsettings set \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              WEBSITE_DISABLE_SCM_SEPARATION=false

      - name: Restart App Service (pre-deploy)
        run: |
          echo "🔄 Restarting App Service before deployment..."
          az webapp restart \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

          echo "⏳ Waiting briefly after restart..."
          sleep 15

      - name: Check SCM/Kudu endpoint health (pre-deploy)
        run: |
          echo "🔎 Checking SCM/Kudu endpoint health..."
          SCM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.FRONTEND_APP_NAME }}.scm.azurewebsites.net/" || echo "000")
          echo "SCM status: $SCM_STATUS"
          # 401/403 is expected for unauthenticated callers. 503 indicates SCM is unhealthy.
          if [ "$SCM_STATUS" = "503" ]; then
            echo "⚠️ SCM/Kudu is returning 503 (Service Unavailable). Deployments will fail until SCM recovers."
          fi

      - name: Deploy to App Service
        run: |
          echo "🚀 Deploying frontend to Azure App Service..."
          # Retry because SCM/Kudu can be temporarily unavailable (503/504).
          max_attempts=3
          attempt=1
          deployed=0
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Attempt $attempt/$max_attempts"
            if az webapp deploy \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.FRONTEND_APP_NAME }} \
              --src-path ./deploy/frontend-app.zip \
              --type zip \
              --timeout 600; then
              echo "✅ Deployment succeeded."
              deployed=1
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ Deployment failed after $max_attempts attempts."
              exit 1
            fi

            echo "⏳ Deployment attempt failed; backing off before retry..."
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done

          if [ "$deployed" -ne 1 ]; then
            echo "⚠️ az webapp deploy did not succeed. Falling back to legacy ZIP deploy with extended timeout."
            echo "⚠️ NOTE: This uses a deprecated command as a reliability workaround."
            az webapp deployment source config-zip \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.FRONTEND_APP_NAME }} \
              --src ./deploy/frontend-app.zip \
              --timeout 1800
          fi

          echo "✅ Deployment completed!"

      - name: Show deployment logs (after deploy)
        run: |
          echo "🧾 Latest deployment log summary:"
          az webapp log deployment show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.FRONTEND_APP_NAME }} || true

          echo "📜 Recent deployments:"
          az webapp log deployment list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --query "[0:5]" \
            -o table || true

      - name: Show deployment logs (on failure)
        if: failure()
        run: |
          echo "🧾 Deployment failed; dumping App Service deployment logs..."
          echo "🔎 SCM endpoint HTTP status (should be 401/403; 503 indicates SCM unhealthy):"
          SCM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.FRONTEND_APP_NAME }}.scm.azurewebsites.net/" || echo "000")
          echo "SCM status: $SCM_STATUS"

          az webapp log deployment show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.FRONTEND_APP_NAME }} || true

          az webapp log deployment list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --query "[0:10]" \
            -o table || true

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for App Service to process deployment..."
          sleep 30

      - name: Verify deployment
        run: |
          echo "🔍 Verifying frontend deployment..."

          # Get the app URL
          APP_URL=$(az webapp show \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query defaultHostName -o tsv)

          echo "Frontend URL: https://$APP_URL"

          # Check if site is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP_URL" || echo "000")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Frontend is accessible! (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Frontend returned HTTP $HTTP_STATUS"
            echo "The app may still be starting. Check Azure Portal for details."
          fi

          # Display deployment summary
          echo "## 🎉 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App Name**: ${{ env.FRONTEND_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: [https://$APP_URL](https://$APP_URL)" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: HTTP $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Frontend deployment successful and accessible!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Frontend deployed but may still be starting. Monitor in Azure Portal." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Restart App Service
        run: |
          echo "🔄 Restarting App Service to ensure clean startup..."
          az webapp restart \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

          echo "✅ App Service restarted successfully!"
