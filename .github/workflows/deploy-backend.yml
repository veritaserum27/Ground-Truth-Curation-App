name: deploy-backend

on:
  push:
    branches:
    - iac
    paths:
    - 'backend/**'
    - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  BACKEND_APP_NAME: ${{ vars.RESOURCE_NAME_PREFIX }}-backend

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: 'backend/**/packages.lock.json'

    - name: Restore dependencies
      working-directory: backend
      run: |
        echo "📦 Restoring .NET dependencies..."
        dotnet restore GroundTruthCuration.sln --locked-mode

    - name: Build solution
      working-directory: backend
      run: |
        echo "🔨 Building solution in Release configuration..."
        dotnet build GroundTruthCuration.sln \
          --configuration Release \
          --no-restore

    - name: Publish API
      working-directory: backend
      run: |
        echo "📤 Publishing API project..."
        dotnet publish src/GroundTruthCuration.Api/GroundTruthCuration.Api.csproj \
          --configuration Release \
          --no-build \
          --output ./publish

    - name: Create deployment package
      working-directory: backend/publish
      run: |
        echo "📦 Creating zip deployment package..."
        zip -r ../backend-api.zip .
        cd ..
        ls -lh backend-api.zip

    - name: Upload deployment artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-api-${{ github.sha }}
        path: backend/backend-api.zip
        retention-days: 7

  deploy:
    name: Deploy Backend to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
    - name: Download deployment artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-api-${{ github.sha }}
        path: ./deploy

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Configure App Service deployment settings
      run: |
        echo "⚙️ Configuring App Service deployment settings..."
        # Reduce Kudu work during ZIP deployment and improve reliability.
        az webapp config appsettings set \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.BACKEND_APP_NAME }} \
          --settings \
            SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            WEBSITE_RUN_FROM_PACKAGE=1 \
            WEBSITE_DISABLE_SCM_SEPARATION=false

    - name: Restart App Service (pre-deploy)
      run: |
        echo "🔄 Restarting App Service before deployment..."
        az webapp restart \
          --name ${{ env.BACKEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

        echo "⏳ Waiting briefly after restart..."
        sleep 15

    - name: Deploy to App Service
      run: |
        echo "🚀 Deploying backend API to Azure App Service..."

        # Use the supported ZIP deploy command (replaces deprecated config-zip)
        # Retry because SCM/Kudu can be temporarily unavailable (503/504).
        max_attempts=3
        attempt=1
        deployed=0
        while [ "$attempt" -le "$max_attempts" ]; do
          echo "Attempt $attempt/$max_attempts"
          if az webapp deploy \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.BACKEND_APP_NAME }} \
            --src-path ./deploy/backend-api.zip \
            --type zip \
            --async true; then
            echo "✅ Deploy command accepted."
            deployed=1
            break
          fi

          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "❌ Deployment failed after $max_attempts attempts."
            exit 1
          fi

          echo "⏳ Deployment attempt failed; backing off before retry..."
          sleep $((attempt * 30))
          attempt=$((attempt + 1))
        done

        if [ "$deployed" -ne 1 ]; then
          echo "⚠️ az webapp deploy did not succeed. Falling back to legacy ZIP deploy with extended timeout."
          echo "⚠️ NOTE: This uses a deprecated command as a reliability workaround."
          az webapp deployment source config-zip \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.BACKEND_APP_NAME }} \
            --src ./deploy/backend-api.zip \
            --timeout 1800
        fi

        echo "✅ Deployment completed!"

    - name: Show deployment logs (on failure)
      if: failure()
      run: |
        echo "🧾 Deployment failed; dumping App Service deployment logs..."
        echo "🔎 App state (safe diagnostics):"
        az webapp show \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.BACKEND_APP_NAME }} \
          --query '{name:name, state:state, kind:kind, httpsOnly:httpsOnly, reserved:reserved, defaultHostName:defaultHostName}' \
          -o json || true

        echo "🔎 Site config (safe diagnostics):"
        az webapp config show \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.BACKEND_APP_NAME }} \
          --query '{linuxFxVersion:linuxFxVersion, appCommandLine:appCommandLine, healthCheckPath:healthCheckPath}' \
          -o json || true

        echo "🔎 SCM endpoint HTTP status (should be 401/403; 503 indicates SCM unhealthy):"
        SCM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.BACKEND_APP_NAME }}.scm.azurewebsites.net/" || echo "000")
        echo "SCM status: $SCM_STATUS"

        # Shows the latest deployment log summary (Kudu/OneDeploy).
        az webapp log deployment show \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.BACKEND_APP_NAME }} || true

        echo "📜 Recent deployments:"
        az webapp log deployment list \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name ${{ env.BACKEND_APP_NAME }} \
          --top 5 || true

    - name: Wait for deployment
      run: |
        echo "⏳ Waiting for App Service to process deployment..."
        sleep 30

    - name: Verify deployment
      run: |
        echo "🔍 Verifying backend deployment..."

        # Get the app URL
        APP_URL=$(az webapp show \
          --name ${{ env.BACKEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query defaultHostName -o tsv)

        echo "Backend URL: https://$APP_URL"

        # Check health endpoint
        HEALTH_URL="https://$APP_URL/healthz"
        echo "Checking health endpoint: $HEALTH_URL"

        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")

        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "✅ Backend is healthy! (HTTP $HTTP_STATUS)"
        else
          echo "⚠️ Health check returned HTTP $HTTP_STATUS"
          echo "The app may still be starting. Check Azure Portal for details."
        fi

        # Display deployment summary
        echo "## 🎉 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**App Name**: ${{ env.BACKEND_APP_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "**URL**: [https://$APP_URL](https://$APP_URL)" >> $GITHUB_STEP_SUMMARY
        echo "**Environment**: ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
        echo "**Health Check**: $HEALTH_URL" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: HTTP $HTTP_STATUS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "✅ Backend deployment successful and healthy!" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Backend deployed but health check pending. Monitor in Azure Portal." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Restart App Service
      run: |
        echo "🔄 Restarting App Service to ensure clean startup..."
        az webapp restart \
          --name ${{ env.BACKEND_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

        echo "✅ App Service restarted successfully!"
